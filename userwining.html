<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Winning</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    font-family:Arial;
    background:#f2f2f2;
    margin:0;
    padding:0;
}

.header{
    background:green;
    color:#fff;
    text-align:center;
    padding:15px;
    font-size:20px;
    font-weight:bold;
}

.card{
    background:#fff;
    margin:10px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.market{
    font-size:17px;
    font-weight:bold;
    color:#333;
}

.date{
    margin-top:7px;
    color:#666;
    font-size:14px;
}

.win{
    color:green;
    font-weight:bold;
    font-size:20px;
    margin-top:8px;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:#666;
}

.error{
    text-align:center;
    padding:30px 10px;
    color:red;
}

.loading{
    text-align:center;
    padding:30px 10px;
    color:#555;
}

</style>

</head>


<body>


<div class="header">
    My Winning
</div>


<div id="list">

    <div class="loading">
        Loading...
    </div>

</div>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";


const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



// ==========================================
// LOAD USER WINNING
// ==========================================

async function loadWinning(){

    const list =
        document.getElementById("list");


    // ======================================
    // GET LOGIN DATA
    // ======================================

    const userData =
        localStorage.getItem("user");


    // ======================================
    // LOGIN CHECK
    // ======================================

    if(!userData){

        list.innerHTML = `

            <div class="error">

                Please login first!

            </div>

        `;

        return;
    }



    // ======================================
    // CONVERT USER DATA
    // ======================================

    let user;

    try{

        user =
            JSON.parse(userData);

    }catch(error){

        console.log(
            "USER DATA ERROR:",
            error
        );

        list.innerHTML = `

            <div class="error">

                Login information is invalid.

            </div>

        `;

        return;
    }



    // ======================================
    // LOGIN TABLE KI ID
    // ======================================

    const loginId = user.id;


    console.log(
        "LOGIN TABLE ID:",
        loginId
    );



    // ======================================
    // ID CHECK
    // ======================================

    if(
        loginId === undefined ||
        loginId === null ||
        loginId === ""
    ){

        list.innerHTML = `

            <div class="error">

                User ID not found.
                Please login again.

            </div>

        `;

        return;
    }



    // ======================================
    // WINING TABLE SE DATA
    // ======================================
    //
    // login.id
    //      ↓
    // wining.user_id
    //
    // ======================================

    const {
        data,
        error
    } = await client

        .from("wining")

        .select("*")

        .eq(
            "user_id",
            loginId
        )

        .order(
            "id",
            {
                ascending:false
            }
        );



    // ======================================
    // SUPABASE ERROR
    // ======================================

    if(error){

        console.log(
            "WINING ERROR:",
            error
        );

        list.innerHTML = `

            <div class="error">

                Error loading winning.

            </div>

        `;

        return;
    }



    // ======================================
    // DEBUG
    // ======================================

    console.log(
        "CURRENT LOGIN ID:",
        loginId
    );

    console.log(
        "WINING DATA:",
        data
    );



    // ======================================
    // NO WINNING
    // ======================================

    if(
        !data ||
        data.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                <h3>No Winning Found</h3>

            </div>

        `;

        return;
    }



    // ======================================
    // SHOW WINNING
    // ======================================

    let html = "";



    data.forEach(function(item){


        // ==================================
        // AMOUNT
        // ==================================

        const amount =
            item.amount || 0;



        // ==================================
        // DATE
        // ==================================

        let date =
            "No Date";


        if(item.created_at){

            date =
                new Date(
                    item.created_at
                ).toLocaleString(
                    "en-IN"
                );

        }



        // ==================================
        // CARD
        // ==================================

        html += `

            <div class="card">

                <div class="market">

                    Market:
                    ${item.market || "-"}

                </div>


                <div class="date">

                    Date:
                    ${date}

                </div>


                <div class="win">

                    ₹ ${amount}

                </div>

            </div>

        `;

    });



    // ======================================
    // DISPLAY
    // ======================================

    list.innerHTML =
        html;

}



// ==========================================
// START
// ==========================================

loadWinning();


</script>


</body>

</html>
