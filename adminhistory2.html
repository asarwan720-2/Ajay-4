<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Number History</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    background:#f2f2f2;
    font-family:Arial;
}

/* HEADER */

.header{
    background:#fff;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}


/* FILTER */

.filters{
    background:#fff;
    padding:10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filters select,
.filters input{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

.date{
    flex:1;
}

.number{
    flex:1;
    min-width:100px;
}

.harf{
    flex:1;
}

.search{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:green;
    color:white;
    font-weight:bold;
    font-size:16px;
}


/* TOTAL */

.totalBox{
    background:#fff;
    margin:10px;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.totalAmount{
    font-size:24px;
    font-weight:bold;
    color:red;
}


/* RESULT */

#results{
    padding:5px;
}

.card{
    background:#fff;
    margin:10px 5px;
    padding:15px;
    border-radius:12px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.market{
    color:red;
    font-weight:bold;
    font-size:18px;
}

.amount{
    background:red;
    color:white;
    padding:6px 10px;
    border-radius:7px;
    font-weight:bold;
}

.info{
    margin-top:8px;
    line-height:1.7;
}

.harfA{
    color:green;
    font-weight:bold;
}

.harfB{
    color:blue;
    font-weight:bold;
}

.dateText{
    color:#777;
    font-size:12px;
    margin-top:8px;
}

.noData{
    background:#fff;
    margin:10px;
    padding:20px;
    text-align:center;
    border-radius:12px;
}

</style>

</head>

<body>


<div class="header">
    Number History
</div>


<!-- FILTERS -->

<div class="filters">

<select id="dateFilter" class="date">

    <option value="">
        All Date
    </option>

    <option value="today">
        Today
    </option>

    <option value="yesterday">
        Yesterday
    </option>

</select>


<input
    type="number"
    id="numberFilter"
    class="number"
    placeholder="Number"
/>


<select id="harfFilter" class="harf">

    <option value="">
        All Harf
    </option>

    <option value="A">
        A
    </option>

    <option value="B">
        B
    </option>

</select>


<button
    class="search"
    onclick="searchNumber()"
>
    SEARCH
</button>

</div>


<!-- TOTAL -->

<div class="totalBox">

    <div>
        Total Amount
    </div>

    <div
        class="totalAmount"
        id="totalAmount"
    >
        ₹ 0
    </div>

</div>


<!-- RESULTS -->

<div id="results">
    <div class="noData">
        Number enter karke SEARCH dabao
    </div>
</div>



<script>


/* SUPABASE */

const client = supabase.createClient(

    "https://katbdbzoufiblnnsoxkk.supabase.co",

    "sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a"

);



/* ALL HISTORY */

let fullData = [];



/* LOAD HISTORY */

async function loadHistory(){

    const { data, error } = await client

        .from("history")

        .select("*")

        .order("id", {
            ascending:false
        });


    if(error){

        console.log(error);

        document.getElementById("results").innerHTML =

            `<div class="noData">
                Data load nahi hua
            </div>`;

        return;
    }


    fullData = data || [];

}



loadHistory();



/* SEARCH */

function searchNumber(){


    const numberInput =

        document
        .getElementById("numberFilter")
        .value
        .trim();


    const dateFilter =

        document
        .getElementById("dateFilter")
        .value;


    const harfFilter =

        document
        .getElementById("harfFilter")
        .value;



    if(numberInput === ""){

        alert("Number daalo");

        return;
    }



    /*
       45 ko "45" format me rakhenge
       5 ko "05" bhi match karne ki koshish hogi
    */

    const searchNumber1 =
        String(numberInput);


    const searchNumber2 =
        String(numberInput).padStart(2,"0");



    let results = [];

    let total = 0;



    /* HISTORY LOOP */

    fullData.forEach(item => {


        /* DATE FILTER */

        if(dateFilter){

            const itemDate =
                new Date(item.created_at);

            const today =
                new Date();


            if(dateFilter === "today"){

                if(
                    itemDate.toDateString()
                    !==
                    today.toDateString()
                ){

                    return;
                }

            }


            if(dateFilter === "yesterday"){

                const yesterday =
                    new Date();

                yesterday.setDate(
                    today.getDate() - 1
                );


                if(
                    itemDate.toDateString()
                    !==
                    yesterday.toDateString()
                ){

                    return;
                }

            }

        }



        /* DATA JSON */

        let parsed;


        try{

            if(!item.data){

                return;
            }


            parsed =
                typeof item.data === "string"

                ? JSON.parse(item.data)

                : item.data;


            if(!Array.isArray(parsed)){

                parsed = [parsed];

            }

        }catch(e){

            return;

        }



        /* EACH ENTRY */

        parsed.forEach(p => {


            if(!p){

                return;

            }



            /* NUMBER */

            const numberValue =
                p.number ??
                p.num ??
                null;


            if(numberValue === null){

                return;

            }



            const numberString =
                String(numberValue);


            const numberPadded =
                numberString.padStart(2,"0");



            /* NUMBER MATCH */

            if(
                numberString !== searchNumber1
                &&
                numberPadded !== searchNumber2
            ){

                return;
            }



            /* HARF */

            let harf = "";


            if(p.type === "A"){

                harf = "A";

            }
            else if(p.type === "B"){

                harf = "B";

            }



            /* HARF FILTER */

            if(
                harfFilter
                &&
                harf !== harfFilter
            ){

                return;

            }



            /* AMOUNT */

            const amount =

                Number(
                    p.amount ??
                    p.a ??
                    p.value ??
                    0
                );


            total += amount;



            /* RESULT */

            results.push({

                id: item.user_id,

                market: item.market,

                number:
                    numberPadded,

                harf: harf || "-",

                amount: amount,

                date: item.created_at

            });


        });


    });



    renderResults(results, total);

}



/* RENDER */

function renderResults(data, total){


    const resultsDiv =
        document.getElementById("results");


    const totalDiv =
        document.getElementById("totalAmount");



    totalDiv.innerText =
        "₹ " + total;



    if(data.length === 0){

        resultsDiv.innerHTML =

            `<div class="noData">
                Is number ka data nahi mila
            </div>`;

        return;
    }



    let html = "";



    data.forEach(item => {


        const harfClass =

            item.harf === "A"

            ? "harfA"

            : "harfB";



        html += `

        <div class="card">

            <div class="top">

                <div class="market">
                    ${item.market || "-"}
                </div>

                <div class="amount">
                    ₹ ${item.amount}
                </div>

            </div>


            <div class="info">

                <b>ID:</b>
                ${item.id || "-"}

                <br>


                <b>Number:</b>
                ${item.number}

                <br>


                <b>Harf:</b>

                <span class="${harfClass}">
                    ${item.harf}
                </span>

            </div>


            <div class="dateText">

                ${new Date(
                    item.date
                ).toLocaleString()}

            </div>

        </div>

        `;

    });



    resultsDiv.innerHTML = html;

}

</script>


</body>
</html>
