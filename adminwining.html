<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reward Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.header{
    background:green;
    color:white;
    text-align:center;
    padding:16px;
    font-size:21px;
    font-weight:bold;
}

.card{
    background:white;
    margin:12px;
    padding:18px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-weight:bold;
}

select,
input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:green;
    color:white;
    font-size:17px;
    font-weight:bold;
}

button:active{
    transform:scale(.98);
}

.message{
    text-align:center;
    margin:12px;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

</style>

</head>

<body>

<div class="header">
    Reward Admin
</div>


<div class="card">

    <label>User ID</label>

    <select id="userId">

        <option value="">
            Select User ID
        </option>

    </select>


    <label>Date</label>

    <select id="rewardDate">

        <option value="">
            Select Date
        </option>

    </select>


    <label>Category</label>

    <select id="category">

        <option value="">
            Select Category
        </option>

        <option value="Reward">
            Reward
        </option>

        <option value="Bonus">
            Bonus
        </option>

        <option value="Points">
            Points
        </option>

    </select>


    <label>Points</label>

    <input
        type="number"
        id="amount"
        placeholder="Enter points"
        min="0"
    >


    <button onclick="addReward()">
        ADD REWARD
    </button>

</div>


<div id="message"
     class="message">
</div>


<script>


// ======================================
// SUPABASE
// ======================================

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ======================================
// LOAD USER IDs
// ======================================

async function loadUsers(){

    const select =
        document.getElementById("userId");

    const {
        data,
        error
    } = await client

        .from("login")

        .select("id")

        .order("id", {
            ascending:true
        });


    if(error){

        console.log(error);

        select.innerHTML = `
            <option value="">
                User ID loading error
            </option>
        `;

        return;
    }


    data.forEach(function(user){

        const option =
            document.createElement("option");

        option.value =
            user.id;

        option.textContent =
            "User ID: " + user.id;

        select.appendChild(option);

    });

}


// ======================================
// LOAD DATES
// ======================================

function loadDates(){

    const select =
        document.getElementById("rewardDate");


    const today =
        new Date();


    for(let i = 0; i < 30; i++){

        const date =
            new Date(today);

        date.setDate(
            today.getDate() - i
        );


        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth()+1
            ).padStart(2,"0");

        const day =
            String(
                date.getDate()
            ).padStart(2,"0");


        const value =
            `${year}-${month}-${day}`;


        const option =
            document.createElement("option");

        option.value =
            value;

        option.textContent =
            `${day}-${month}-${year}`;


        select.appendChild(option);

    }

}


// ======================================
// ADD REWARD
// ======================================

async function addReward(){

    const userId =
        document.getElementById(
            "userId"
        ).value;

    const rewardDate =
        document.getElementById(
            "rewardDate"
        ).value;

    const category =
        document.getElementById(
            "category"
        ).value;

    const amount =
        document.getElementById(
            "amount"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML = "";
    message.className =
        "message";


    if(
        !userId ||
        !rewardDate ||
        !category ||
        !amount
    ){

        message.innerHTML =
            "Please fill all fields.";

        message.classList.add(
            "error"
        );

        return;
    }


    // ==================================
    // INSERT
    // ==================================

    const {
        data,
        error
    } = await client

        .from("rewards")

        .insert({

            user_id: userId,

            reward_date: rewardDate,

            category: category,

            amount: Number(amount)

        });


    if(error){

        console.log(
            "SUPABASE ERROR:",
            error
        );

        message.innerHTML =
            "Error adding reward.";

        message.classList.add(
            "error"
        );

        return;
    }


    message.innerHTML =
        "Reward added successfully ✅";

    message.classList.add(
        "success"
    );


    document.getElementById(
        "amount"
    ).value = "";

}


// ======================================
// START
// ======================================

loadUsers();

loadDates();


</script>

</body>

</html>
