<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Entry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

.header{
    background:green;
    color:white;
    text-align:center;
    padding:16px;
    font-size:21px;
    font-weight:bold;
}

.card{
    background:white;
    margin:12px;
    padding:18px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-weight:bold;
}

select,
input{
    width:100%;
    box-sizing:border-box;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:green;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.message{
    text-align:center;
    margin:15px;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

</style>
</head>

<body>

<div class="header">
    Admin Entry
</div>

<div class="card">

    <label>User ID</label>

    <select id="userId">
        <option value="">Loading User IDs...</option>
    </select>


    <label>Date</label>

    <select id="entryDate">
        <option value="">Select Date</option>
    </select>


    <label>Market</label>

    <input
        type="text"
        id="market"
        placeholder="Enter Market"
    >


    <label>Amount</label>

    <input
        type="number"
        id="amount"
        placeholder="Enter Amount"
        min="0"
    >


    <button onclick="addEntry()">
        ADD ENTRY
    </button>

</div>

<div id="message" class="message"></div>


<script>

// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
"https://katbdbzoufiblnnsoxkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_--fdpQMmSlUyt2ywjUErgQ_LXGvQH-a";

const client =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==========================================
// LOAD USER IDs FROM LOGIN TABLE
// ==========================================

async function loadUsers(){

    const select =
        document.getElementById("userId");

    const {
        data,
        error
    } = await client
        .from("login")
        .select("id")
        .order("id", {
            ascending:true
        });

    if(error){

        console.log("USER ERROR:", error);

        select.innerHTML = `
            <option value="">
                Error loading User IDs
            </option>
        `;

        return;
    }

    select.innerHTML = `
        <option value="">
            Select User ID
        </option>
    `;

    data.forEach(function(user){

        const option =
            document.createElement("option");

        option.value = user.id;

        option.textContent =
            "User ID: " + user.id;

        select.appendChild(option);

    });

}


// ==========================================
// LOAD DATES
// ==========================================

function loadDates(){

    const select =
        document.getElementById("entryDate");

    const today = new Date();

    for(let i = 0; i < 30; i++){

        const date = new Date(today);

        date.setDate(
            today.getDate() - i
        );

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2,"0");

        const day =
            String(
                date.getDate()
            ).padStart(2,"0");

        const value =
            `${year}-${month}-${day}`;

        const option =
            document.createElement("option");

        option.value = value;

        option.textContent =
            `${day}-${month}-${year}`;

        select.appendChild(option);

    }

}


// ==========================================
// ADD ROW
// ==========================================

async function addEntry(){

    const userId =
        document.getElementById("userId").value;

    const entryDate =
        document.getElementById("entryDate").value;

    const market =
        document.getElementById("market")
        .value
        .trim();

    const amount =
        document.getElementById("amount").value;

    const message =
        document.getElementById("message");


    message.innerHTML = "";
    message.className = "message";


    if(
        !userId ||
        !entryDate ||
        !market ||
        !amount
    ){

        message.innerHTML =
            "Please fill all fields.";

        message.classList.add("error");

        return;
    }


    // ======================================
    // INSERT ROW
    // ======================================

    const {
        data,
        error
    } = await client

        .from("wining")

        .insert({

            user_id: Number(userId),

            market: market,

            amount: Number(amount),

            created_at:
                entryDate + "T00:00:00"

        })
        .select();


    if(error){

        console.log(
            "SUPABASE INSERT ERROR:",
            error
        );

        message.innerHTML =
            "Error: " + error.message;

        message.classList.add("error");

        return;
    }


    message.innerHTML =
        "Row added successfully ✅";

    message.classList.add("success");


    // Clear market and amount

    document.getElementById(
        "market"
    ).value = "";

    document.getElementById(
        "amount"
    ).value = "";

}


// ==========================================
// START
// ==========================================

loadUsers();

loadDates();

</script>

</body>
</html>
