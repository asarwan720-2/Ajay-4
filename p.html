<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parchi Reader</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
  padding:15px;
}.box{ background:white; padding:15px; border-radius:10px; margin-bottom:15px; }

h2{ margin-top:0; text-align:center; }

input[type=file]{ width:100%; padding:10px; }

button{ width:100%; padding:12px; border:none; border-radius:8px; background:#0057d8; color:white; font-size:18px; margin-top:10px; }

textarea{ width:100%; height:180px; border:1px solid #ccc; border-radius:8px; padding:10px; font-size:15px; box-sizing:border-box; }

.result{ background:black; color:#00ff00; padding:12px; border-radius:8px; white-space:pre-wrap; font-size:15px; }

img{ width:100%; border-radius:10px; margin-top:10px; } </style>

</head>
<body><div class="box">
<h2>Parchi Auto Reader</h2><input type="file" id="imageInput" accept="image/*"><img id="preview" style="display:none;"><button onclick="readImage()">Read Parchi</button>

</div><div class="box">
<h3>Detected Text</h3>
<textarea id="rawText"></textarea>
</div><div class="box">
<h3>Amount Wise Grouping</h3>
<div class="result" id="finalResult"></div>
</div><script>

const imageInput = document.getElementById('imageInput');
const preview = document.getElementById('preview');

imageInput.addEventListener('change',()=>{
  const file = imageInput.files[0];

  if(file){
    preview.src = URL.createObjectURL(file);
    preview.style.display='block';
  }
});

async function readImage(){

const file = imageInput.files[0];

if(!file){
  alert('Select image first');
  return;
}

rawText.value = 'Reading...';
finalResult.innerText = 'Please wait...';

const result = await Tesseract.recognize(file,'eng');

let text = result.data.text;

rawText.value = text;

processText(text);

}

function processText(text){

text = text.replace(/\n/g,' ');
text = text.replace(/[^0-9 ]/g,' ');

let arr = text.split(/\s+/).filter(x=>x);

let groups = {
  5:[],
  10:[],
  15:[],
  20:[],
  25:[],
  30:[],
  40:[],
  50:[]
};

arr.forEach(item=>{

item = item.trim();

if(item.length===2){
  groups[5].push(item);
}

else if(item.length===4){

let num = item.slice(0,2);
let amt = item.slice(2);

if(groups[amt]){
  groups[amt].push(num);
}

}

});

let output='';

Object.keys(groups).forEach(key=>{

if(groups[key].length>0){

output += key + ' rs wale:\n\n';
output += groups[key].join(' ') + ' -'+key+'\n\n';

}

});

finalResult.innerText = output;

}

</script></body>
</html>
