<!-- adminchart.html -->

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Chart</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f2f2f2;
}

.top{
  background:#0057d8;
  color:white;
  padding:12px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th{
  background:#ffcc00;
  padding:10px;
  border:1px solid #ccc;
}

td{
  border:1px solid #ddd;
  text-align:center;
  padding:8px;
}

input{
  width:50px;
  text-align:center;
  font-size:16px;
}

button{
  width:95%;
  margin:15px auto;
  display:block;
  padding:12px;
  border:none;
  background:#0057d8;
  color:white;
  font-size:18px;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="top">
Admin Result Panel
</div>

<table>
<tr>
<th>DATE</th>
<th>DSWR</th>
<th>FRBD</th>
<th>GZBD</th>
<th>GALI</th>
</tr>

<tbody id="tableBody"></tbody>

</table>

<button onclick="saveData()">
SAVE RESULT
</button>

<script>

let body = document.getElementById("tableBody");

for(let i=1;i<=31;i++){

body.innerHTML += `
<tr>
<td>${i}</td>

<td><input id="dswr${i}" maxlength="2"></td>

<td><input id="frbd${i}" maxlength="2"></td>

<td><input id="gzbd${i}" maxlength="2"></td>

<td><input id="gali${i}" maxlength="2"></td>

</tr>
`;

}

function saveData(){

let allData=[];

for(let i=1;i<=31;i++){

allData.push({
date:i,
dswr:document.getElementById("dswr"+i).value,
frbd:document.getElementById("frbd"+i).value,
gzbd:document.getElementById("gzbd"+i).value,
gali:document.getElementById("gali"+i).value
});

}

localStorage.setItem("chartData",JSON.stringify(allData));

alert("Saved");

}

function loadData(){

let data = JSON.parse(localStorage.getItem("chartData"));

if(data){

data.forEach(item=>{

document.getElementById("dswr"+item.date).value=item.dswr;
document.getElementById("frbd"+item.date).value=item.frbd;
document.getElementById("gzbd"+item.date).value=item.gzbd;
document.getElementById("gali"+item.date).value=item.gali;

});

}

}

loadData();

</script>

</body>
</html>
